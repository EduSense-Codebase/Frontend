repos:
-   repo: local
    hooks:
    -   id: format
        name: npm run format
        entry: bash -c "cd edusense-frontend && npm run format"
        language: system
        pass_filenames: false # Prevents pre-commit from passing file paths to the hook
        files: '^edusense-frontend/.+' # Filter files to trigger the hook only on relevant changes

    -   id: lint
        name: npm run lint
        entry: bash -c "cd edusense-frontend && npm run lint"
        language: system
        pass_filenames: false # Prevents pre-commit from passing file paths
        files: '^edusense-frontend/.+' # Filter files to trigger the hook only on relevant changes

